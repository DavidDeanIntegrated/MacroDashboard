[extend]
# Keep the built-in rules. This file only adds an allowlist.
useDefault = true

# PR commits contain synthetic generic-api-key fixtures
# ("synthetic-alpaca-key-0123456789" and similar) in the two test files below.
# Allow those paths for that rule so the range scan passes without rewriting
# history. Other rules still apply to the files, and generic-api-key still
# applies to every other path.
[[allowlists]]
description = "Synthetic generic-api-key fixtures in the API bounds and Alpaca market-data tests"
targetRules = ["generic-api-key"]
paths = ['''(^|/)tests/(api-bounds|alpaca-market-data)\.test\.cjs$''']
